<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短视频解析</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="短视频解析">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen">
    <main class="max-w-3xl mx-auto px-6 py-16">
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800 tracking-tight">短视频解析</h1>
            <p class="text-slate-500 mt-3 text-sm">粘贴链接，一键提取无水印素材</p>
        </header>

        <section class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-100">
            <div class="flex flex-col sm:flex-row gap-3 mb-6">
                <div class="relative flex-1">
                    <input type="text" id="parseUrl" placeholder="粘贴视频链接，例如 https://v.douyin.com/..."
                        class="w-full pl-5 pr-12 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all text-slate-700">
                    <button id="pasteBtn" type="button" onclick="handlePaste()" title="从剪贴板粘贴"
                        class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">
                        <i class="fas fa-paste"></i>
                    </button>
                </div>
                <button id="parseBtn" onclick="handleParse()"
                    class="px-8 py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition-colors flex items-center justify-center space-x-2 whitespace-nowrap">
                    <i class="fas fa-magic"></i>
                    <span>解析</span>
                </button>
            </div>

            <div id="clipboardHint"
                class="hidden items-center justify-between gap-3 mb-4 px-4 py-2.5 bg-indigo-50 border border-indigo-100 rounded-xl text-sm">
                <div class="flex items-center gap-2 text-indigo-700 min-w-0">
                    <i class="fas fa-clipboard shrink-0"></i>
                    <span class="truncate">检测到剪贴板链接：<span id="clipboardPreview" class="font-mono text-xs"></span></span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="acceptClipboard()" class="px-3 py-1 bg-indigo-600 text-white rounded-md text-xs font-semibold hover:bg-indigo-700">填入</button>
                    <button onclick="dismissClipboard()" class="px-3 py-1 bg-white border border-slate-200 text-slate-500 rounded-md text-xs hover:bg-slate-50">忽略</button>
                </div>
            </div>

            <div id="loadingState" class="hidden flex-col items-center justify-center py-12 text-slate-400">
                <i class="fas fa-circle-notch fa-spin text-3xl text-indigo-500 mb-3"></i>
                <p class="text-sm">解析中...</p>
            </div>

            <div id="errorState"
                class="hidden flex-col items-center justify-center py-8 bg-red-50 rounded-xl border border-red-100 text-red-500">
                <i class="fas fa-exclamation-circle text-3xl mb-2"></i>
                <p id="errorMsg" class="text-sm">解析失败</p>
            </div>

            <div id="resultState" class="hidden">
                <!-- 视频/单图模式：左右布局 -->
                <div id="mediaLayout" class="flex flex-col md:flex-row gap-6">
                    <div id="coverWrapper" class="w-full md:w-1/3 shrink-0">
                        <div id="coverBlock"
                            class="relative rounded-xl overflow-hidden shadow-sm aspect-[3/4] bg-slate-100 group">
                            <img id="resultCover" src="" class="w-full h-full object-cover">
                            <div
                                class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <a id="resultVideoPlay" href="" target="_blank"
                                    class="w-12 h-12 bg-white/90 rounded-full flex items-center justify-center text-indigo-600 hover:scale-110 transition-transform shadow">
                                    <i class="fas fa-play ml-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="flex-1 flex flex-col min-w-0">
                        <div class="flex flex-wrap items-center gap-2 mb-3">
                            <span id="resultPlatform"
                                class="hidden px-2.5 py-0.5 bg-indigo-50 text-indigo-600 rounded-full text-xs font-semibold border border-indigo-100"></span>
                            <span
                                class="inline-flex items-center space-x-1 bg-green-50 text-green-600 px-2.5 py-0.5 rounded-full text-xs font-semibold border border-green-100">
                                <i class="fas fa-check-circle"></i>
                                <span>成功</span>
                            </span>
                            <span id="albumBadge"
                                class="hidden items-center space-x-1 bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full text-xs font-semibold border border-indigo-100">
                                <i class="fas fa-images"></i>
                                <span><span id="albumCount">0</span> 张</span>
                            </span>
                        </div>

                        <div id="authorInfo"
                            class="hidden items-center space-x-2 mb-3 bg-slate-50 w-max px-2.5 py-1.5 rounded-lg border border-slate-100">
                            <img id="authorAvatar" src=""
                                class="w-7 h-7 rounded-full object-cover border border-slate-200">
                            <div class="flex flex-col">
                                <span id="authorName" class="text-xs font-semibold text-slate-700"></span>
                                <span id="authorId" class="text-[10px] text-slate-400"></span>
                            </div>
                        </div>

                        <h3 id="resultTitle"
                            class="text-base font-semibold text-slate-800 mb-4 leading-relaxed break-words"></h3>

                        <div id="audioContainer" class="hidden mb-4 w-full">
                            <h4 class="text-xs font-semibold text-slate-500 mb-1.5">
                                <i class="fas fa-music mr-1 text-indigo-500"></i>音频
                            </h4>
                            <audio id="resultAudio" controls
                                class="w-full h-10 rounded-lg bg-slate-50 outline-none"></audio>
                        </div>

                        <!-- 操作按钮区：视频模式显示视频/封面，图集模式显示"打包下载全部" -->
                        <div id="actionVideo" class="hidden mt-auto grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <a id="resultVideoDl"
                                class="flex items-center justify-center space-x-2 px-4 py-2.5 bg-indigo-600 text-white rounded-lg font-medium text-sm hover:bg-indigo-700 transition-colors cursor-pointer">
                                <i class="fas fa-video"></i>
                                <span>下载无水印视频</span>
                            </a>
                            <a id="resultCoverDl"
                                class="flex items-center justify-center space-x-2 px-4 py-2.5 bg-white border border-slate-200 text-slate-700 rounded-lg font-medium text-sm hover:bg-slate-50 transition-colors cursor-pointer">
                                <i class="fas fa-image"></i>
                                <span>下载高清封面</span>
                            </a>
                        </div>

                        <div id="actionAlbum" class="hidden mt-auto">
                            <button id="downloadAllBtn" onclick="downloadAll()"
                                class="w-full flex items-center justify-center space-x-2 px-4 py-2.5 bg-indigo-600 text-white rounded-lg font-medium text-sm hover:bg-indigo-700 transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
                                <i class="fas fa-download"></i>
                                <span id="downloadAllText">打包下载全部图片</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 图集网格区块（独立全宽，仅图集模式显示） -->
                <div id="albumSection" class="hidden mt-8">
                    <div class="flex items-center justify-between mb-3">
                        <h4 class="text-sm font-semibold text-slate-700">
                            <i class="fas fa-images mr-1.5 text-indigo-500"></i>图集
                            <span class="text-xs text-slate-400 font-normal ml-1" id="albumPageInfo"></span>
                        </h4>
                    </div>
                    <div id="albumGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>

                    <div id="albumPager" class="hidden items-center justify-center gap-2 mt-5">
                        <button onclick="changeAlbumPage(-1)" id="prevPageBtn"
                            class="px-3 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <span class="text-xs text-slate-500" id="albumPagerLabel">1 / 1</span>
                        <button onclick="changeAlbumPage(1)" id="nextPageBtn"
                            class="px-3 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <p class="text-center text-xs text-slate-400 mt-8">
            支持抖音 / 快手 / 小红书 / B站 / 微博 / 知乎 / TikTok / YouTube 等主流平台
        </p>
    </main>

    <script>
        async function handleParse() {
            const urlInput = document.getElementById('parseUrl').value.trim();
            const loadingState = document.getElementById('loadingState');
            const resultState = document.getElementById('resultState');
            const errorState = document.getElementById('errorState');
            const parseBtn = document.getElementById('parseBtn');

            if (!urlInput) {
                alert('请输入视频链接');
                return;
            }

            resultState.classList.add('hidden');
            errorState.classList.add('hidden');
            errorState.classList.remove('flex');
            loadingState.classList.remove('hidden');
            loadingState.classList.add('flex');
            parseBtn.disabled = true;
            parseBtn.classList.add('opacity-70');

            try {
                const response = await fetch('/api/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: urlInput })
                });

                const res = await response.json();

                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');

                if (response.ok && res.succ) {
                    renderResult(res.data);
                    resultState.classList.remove('hidden');
                } else {
                    document.getElementById('errorMsg').innerText = res.msg || res.retdesc || '解析失败，请检查链接';
                    errorState.classList.remove('hidden');
                    errorState.classList.add('flex');
                }
            } catch (err) {
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
                document.getElementById('errorMsg').innerText = '网络错误，请稍后重试';
                errorState.classList.remove('hidden');
                errorState.classList.add('flex');
            } finally {
                parseBtn.disabled = false;
                parseBtn.classList.remove('opacity-70');
            }
        }

        // === 渲染结果 ===
        const ALBUM_PAGE_SIZE = 12;
        let albumState = { items: [], page: 0, title: '' };

        function renderResult(data) {
            const platformEl = document.getElementById('resultPlatform');
            if (data.platform) {
                platformEl.innerText = data.platform;
                platformEl.classList.remove('hidden');
            } else {
                platformEl.classList.add('hidden');
            }

            const authorInfo = document.getElementById('authorInfo');
            if (data.author && data.author.nickname) {
                document.getElementById('authorName').innerText = data.author.nickname;
                const authorIdEl = document.getElementById('authorId');
                if (data.author.author_id) {
                    authorIdEl.innerText = 'ID: ' + data.author.author_id;
                    authorIdEl.classList.remove('hidden');
                } else {
                    authorIdEl.classList.add('hidden');
                }
                document.getElementById('authorAvatar').src = data.author.avatar || '';
                authorInfo.classList.remove('hidden');
                authorInfo.classList.add('flex');
            } else {
                authorInfo.classList.add('hidden');
                authorInfo.classList.remove('flex');
            }

            document.getElementById('resultTitle').innerText = data.title || '无标题';

            const audioContainer = document.getElementById('audioContainer');
            const resultAudio = document.getElementById('resultAudio');
            if (data.audio_url) {
                resultAudio.src = data.audio_url;
                audioContainer.classList.remove('hidden');
            } else {
                resultAudio.src = '';
                audioContainer.classList.add('hidden');
            }

            const hasAlbum = Array.isArray(data.image_list) && data.image_list.length > 0;
            const coverWrapper = document.getElementById('coverWrapper');
            const albumSection = document.getElementById('albumSection');
            const albumBadge = document.getElementById('albumBadge');
            const actionVideo = document.getElementById('actionVideo');
            const actionAlbum = document.getElementById('actionAlbum');
            const mediaLayout = document.getElementById('mediaLayout');

            if (hasAlbum) {
                // 图集模式
                coverWrapper.classList.add('hidden');
                mediaLayout.classList.remove('md:flex-row');
                albumSection.classList.remove('hidden');
                albumBadge.classList.remove('hidden');
                albumBadge.classList.add('inline-flex');
                document.getElementById('albumCount').innerText = data.image_list.length;
                actionVideo.classList.add('hidden');
                actionAlbum.classList.remove('hidden');

                albumState = {
                    items: data.image_list,
                    page: 0,
                    title: (data.title || 'album').slice(0, 30)
                };
                renderAlbumPage();
            } else {
                // 视频/单图模式
                coverWrapper.classList.remove('hidden');
                mediaLayout.classList.add('md:flex-row');
                albumSection.classList.add('hidden');
                albumBadge.classList.add('hidden');
                albumBadge.classList.remove('inline-flex');
                actionAlbum.classList.add('hidden');
                actionVideo.classList.remove('hidden');

                document.getElementById('resultCover').src = data.cover_url || '';

                const videoPlayBtn = document.getElementById('resultVideoPlay');
                const videoDlBtn = document.getElementById('resultVideoDl');
                if (data.video_url) {
                    videoPlayBtn.href = data.video_url;
                    videoPlayBtn.parentElement.classList.remove('hidden');
                    videoDlBtn.onclick = () => downloadViaProxy(data.video_url, suggestName(data.title, 'video', data.video_url));
                    videoDlBtn.style.display = 'flex';
                } else {
                    videoPlayBtn.parentElement.classList.add('hidden');
                    videoDlBtn.style.display = 'none';
                }

                const coverDlBtn = document.getElementById('resultCoverDl');
                if (data.cover_url) {
                    coverDlBtn.onclick = () => downloadViaProxy(data.cover_url, suggestName(data.title, 'cover', data.cover_url));
                    coverDlBtn.style.display = 'flex';
                } else {
                    coverDlBtn.style.display = 'none';
                }
            }
        }

        function renderAlbumPage() {
            const grid = document.getElementById('albumGrid');
            grid.innerHTML = '';
            const total = albumState.items.length;
            const totalPages = Math.max(1, Math.ceil(total / ALBUM_PAGE_SIZE));
            if (albumState.page >= totalPages) albumState.page = totalPages - 1;
            if (albumState.page < 0) albumState.page = 0;

            const start = albumState.page * ALBUM_PAGE_SIZE;
            const end = Math.min(start + ALBUM_PAGE_SIZE, total);

            for (let i = start; i < end; i++) {
                const item = albumState.items[i];
                let imgUrl = item;
                let livePhotoUrl = null;
                if (typeof item === 'object' && item !== null) {
                    imgUrl = item.url;
                    livePhotoUrl = item.live_photo_url;
                }

                const idx = i + 1;
                const cell = document.createElement('div');
                cell.className = 'relative rounded-lg overflow-hidden bg-slate-100 group shadow-sm flex flex-col';

                // 图片区
                const imgWrap = document.createElement('div');
                imgWrap.className = 'relative aspect-square bg-slate-100';
                const link = document.createElement('a');
                link.href = imgUrl;
                link.target = '_blank';
                link.rel = 'noopener';
                link.className = 'block w-full h-full';
                const img = document.createElement('img');
                img.src = imgUrl;
                img.loading = 'lazy';
                img.className = 'w-full h-full object-cover';
                link.appendChild(img);
                imgWrap.appendChild(link);

                const badge = document.createElement('div');
                badge.className = 'absolute top-1.5 left-1.5 bg-black/55 text-white text-[10px] font-mono px-1.5 py-0.5 rounded backdrop-blur-sm';
                badge.innerText = String(idx);
                imgWrap.appendChild(badge);

                if (livePhotoUrl) {
                    const liveBadge = document.createElement('div');
                    liveBadge.className = 'absolute top-1.5 right-1.5 bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow flex items-center gap-1';
                    liveBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span><span>LIVE</span>';
                    imgWrap.appendChild(liveBadge);
                }
                cell.appendChild(imgWrap);

                // 下方按钮条：明确的文字标签，永远可见
                const btnBar = document.createElement('div');
                btnBar.className = 'flex' + (livePhotoUrl ? ' divide-x divide-slate-200' : '');

                const dlBtn = document.createElement('button');
                dlBtn.type = 'button';
                dlBtn.className = 'flex-1 px-2 py-2 bg-white hover:bg-slate-50 text-slate-700 text-xs font-medium flex items-center justify-center gap-1.5 transition-colors';
                dlBtn.innerHTML = '<i class="fas fa-image text-slate-400"></i><span>图片</span>';
                dlBtn.addEventListener('click', () => {
                    downloadViaProxy(imgUrl, suggestName(albumState.title, 'img_' + idx, imgUrl));
                });
                btnBar.appendChild(dlBtn);

                if (livePhotoUrl) {
                    const liveBtn = document.createElement('button');
                    liveBtn.type = 'button';
                    liveBtn.className = 'flex-1 px-2 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors';
                    liveBtn.innerHTML = '<i class="fas fa-video"></i><span>实况视频</span>';
                    liveBtn.addEventListener('click', () => {
                        downloadViaProxy(livePhotoUrl, suggestName(albumState.title, 'live_' + idx, livePhotoUrl));
                    });
                    btnBar.appendChild(liveBtn);
                }

                cell.appendChild(btnBar);
                grid.appendChild(cell);
            }

            // 分页器
            const pager = document.getElementById('albumPager');
            const pageInfo = document.getElementById('albumPageInfo');
            const pageLabel = document.getElementById('albumPagerLabel');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');

            pageInfo.innerText = `（${start + 1}–${end} / ${total}）`;
            if (totalPages > 1) {
                pager.classList.remove('hidden');
                pager.classList.add('flex');
                pageLabel.innerText = `${albumState.page + 1} / ${totalPages}`;
                prevBtn.disabled = albumState.page === 0;
                nextBtn.disabled = albumState.page === totalPages - 1;
            } else {
                pager.classList.add('hidden');
                pager.classList.remove('flex');
            }
        }

        function changeAlbumPage(delta) {
            albumState.page += delta;
            renderAlbumPage();
            document.getElementById('albumSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function downloadAll() {
            const btn = document.getElementById('downloadAllBtn');
            const label = document.getElementById('downloadAllText');
            const originalText = label.innerText;

            const urls = [];
            albumState.items.forEach(it => {
                if (typeof it === 'object' && it !== null) {
                    if (it.url) urls.push(it.url);
                    if (it.live_photo_url) urls.push(it.live_photo_url);
                } else if (typeof it === 'string') {
                    urls.push(it);
                }
            });
            if (!urls.length) return;

            btn.disabled = true;
            label.innerText = `打包中（${urls.length} 项）...`;
            try {
                const resp = await fetch('/api/download_zip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls, name: albumState.title || 'album' })
                });
                if (!resp.ok) throw new Error('打包失败');
                const blob = await resp.blob();
                triggerBlobDownload(blob, (albumState.title || 'album') + '.zip');
            } catch (e) {
                alert('打包下载失败：' + e.message);
            } finally {
                btn.disabled = false;
                label.innerText = originalText;
            }
        }

        function downloadViaProxy(url, filename) {
            const proxied = '/api/download?url=' + encodeURIComponent(url) +
                (filename ? '&name=' + encodeURIComponent(filename) : '');
            const a = document.createElement('a');
            a.href = proxied;
            a.download = filename || '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function triggerBlobDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        function suggestName(title, kind, url) {
            const safeTitle = (title || '').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 30) || 'media';
            let ext = '';
            try {
                const path = new URL(url).pathname;
                const dot = path.lastIndexOf('.');
                if (dot > 0 && dot > path.lastIndexOf('/')) {
                    ext = path.slice(dot).toLowerCase();
                    if (ext.length > 6) ext = '';
                }
            } catch (e) {}
            if (!ext) {
                if (kind.startsWith('video') || kind.startsWith('live')) ext = '.mp4';
                else ext = '.jpg';
            }
            return `${safeTitle}_${kind}${ext}`;
        }

        document.getElementById('parseUrl').addEventListener('keydown', e => {
            if (e.key === 'Enter') handleParse();
        });

        // 直接在输入框里粘贴（Ctrl+V / 右键粘贴）：检测到支持的链接就立即解析
        document.getElementById('parseUrl').addEventListener('paste', e => {
            const pasted = (e.clipboardData || window.clipboardData)?.getData('text') || '';
            if (!pasted) return;
            const url = extractSupportedUrl(pasted);
            if (!url) return;
            // 让浏览器先完成默认粘贴动作，再触发解析
            setTimeout(() => {
                document.getElementById('parseUrl').value = pasted.trim();
                handleParse();
            }, 0);
        });

        // === 平台域名白名单（含分享短链）===
        // 与后端 configs/business_config.json::DOMAIN_TO_NAME 的根域对齐，并补充常见短链域名。
        const SUPPORTED_DOMAINS = [
            'douyin.com', 'iesdouyin.com',
            'xiaohongshu.com', 'xhslink.com',
            'kuaishou.com', 'chenzhongtech.com',
            'bilibili.com', 'b23.tv',
            'weibo.com', 'weibo.cn', 't.cn',
            'zhihu.com',
            'ixigua.com',
            'youtube.com', 'youtu.be',
            'tiktok.com',
            'instagram.com',
            'twitter.com', 'x.com',
            'acfun.cn',
            'haokan.baidu.com', 'haokan.hao123.com',
            'weishi.qq.com',
            'pearvideo.com',
            'pipigx.com',
            'doupai.cc',
            'huya.com',
            'meipai.com',
            'pipix.com',
            'quanmin.baidu.com', 'quanmin.hao224.com',
            'kg.qq.com', 'kg2.qq.com',
            '6.cn',
            'xinpianchang.com',
            'izuiyou.com', 'xiaochuankeji.cn'
        ];

        function extractSupportedUrl(text) {
            if (!text) return null;
            const match = text.match(/https?:\/\/[^\s'"<>]+/i);
            if (!match) return null;
            const candidate = match[0];
            try {
                const host = new URL(candidate).hostname.toLowerCase();
                const ok = SUPPORTED_DOMAINS.some(d => host === d || host.endsWith('.' + d));
                return ok ? candidate : null;
            } catch (e) {
                return null;
            }
        }

        // === 粘贴按钮 ===
        async function handlePaste() {
            try {
                const text = await navigator.clipboard.readText();
                if (!text) return;
                document.getElementById('parseUrl').value = text.trim();
                const url = extractSupportedUrl(text);
                if (url) handleParse();
            } catch (e) {
                alert('无法读取剪贴板，请手动粘贴（Ctrl+V）');
            }
        }

        // === 聚焦时自动检测剪贴板里的支持链接 ===
        let lastSeenClipboard = '';

        async function tryDetectClipboard() {
            if (!navigator.clipboard || !navigator.clipboard.readText) return;
            if (document.hidden) return;
            const input = document.getElementById('parseUrl');
            if (input.value.trim()) return;

            try {
                const text = await navigator.clipboard.readText();
                if (!text || text === lastSeenClipboard) return;
                lastSeenClipboard = text;
                const url = extractSupportedUrl(text);
                if (!url) return;
                showClipboardHint(url);
            } catch (e) {
                // 用户未授权或浏览器不支持，静默忽略
            }
        }

        function showClipboardHint(url) {
            const hint = document.getElementById('clipboardHint');
            const preview = document.getElementById('clipboardPreview');
            preview.innerText = url.length > 60 ? url.slice(0, 57) + '...' : url;
            hint.dataset.url = url;
            hint.classList.remove('hidden');
            hint.classList.add('flex');
        }

        function acceptClipboard() {
            const hint = document.getElementById('clipboardHint');
            const url = hint.dataset.url;
            if (url) {
                document.getElementById('parseUrl').value = url;
                dismissClipboard();
                handleParse();
            }
        }

        function dismissClipboard() {
            const hint = document.getElementById('clipboardHint');
            hint.classList.add('hidden');
            hint.classList.remove('flex');
        }

        window.addEventListener('focus', tryDetectClipboard);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) tryDetectClipboard();
        });
        // 页面加载后也尝试一次（多数浏览器需用户先交互，会静默失败）
        setTimeout(tryDetectClipboard, 300);

        // === 注册 Service Worker（PWA）===
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
